<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap / Kayıt Ol - AIFlix</title>
    <link rel="stylesheet" href="/public/css/index.css">
    <link rel="stylesheet" href="/public/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        #backgroundVideo {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -1000;
            object-fit: cover;
        }

        body {
            background-color: rgba(0, 0, 0, 0.4);
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            z-index: -999;
        }

        .topbar {
            background: rgba(0, 0, 0, 0.3) !important;
            backdrop-filter: blur(5px);
        }

        .topbar .wrapper {
            background: transparent !important;
        }

        .topbar .center a {
            background: linear-gradient(90deg, #ff6b08, #2196f3);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .topbar .center a:hover {
            text-shadow: 0 0 10px rgba(255, 107, 8, 0.5);
            transform: scale(1.05);
        }

        .topbar .left i {
            background: linear-gradient(90deg, #ff6b08, #2196f3);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            transition: all 0.3s ease;
            font-size: 20px;
            margin: 0 10px;
        }

        .topbar .left i:hover {
            text-shadow: 0 0 10px rgba(255, 107, 8, 0.5);
            transform: scale(1.15);
        }

        .searchEngine input::placeholder {
            background: linear-gradient(90deg, #ff6b08, #2196f3);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .auth-wrapper {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 30px;
            padding: 50px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .auth-container {
            flex: 1;
            max-width: 500px;
            background: rgba(235, 142, 37, 0.452);
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.5);
        }

        .form-container {
            width: 100%;
        }

        .form-container h2 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 30px;
            color: #fff;
            text-align: center;
            background: linear-gradient(90deg, #ff6b08, #2196f3);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #fff;
            font-size: 14px;
            font-weight: 500;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            color: #fff;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #ff6b08;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 10px rgba(255, 107, 8, 0.3);
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        button[type="submit"] {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #ff6b08, #2196f3);
            color: #fff;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 20px;
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 8, 0.3);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .profile-picture {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }

        .username {
            color: #fff;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <video autoplay muted loop id="backgroundVideo">
        <source src="/public/img/background/backgroundeneme2.mp4" type="video/mp4">
    </video>

    <div class="topbar">
        <div class="wrapper target">
            <div class="left">
                <i class="fa-solid fa-film"></i>
                <i class="fa-solid fa-scissors"></i>
                <i class="fa-solid fa-photo-film"></i>
                <i class="fa-solid fa-video"></i>
            </div>
            <div class="center">
                <a href="/">ANASAYFA</a>
                <a href="cinebot.html">CINEBOT</a>
                <a href="auth.html" id="authLink" style="display: none;">GİRİŞ YAP / KAYIT OL</a>
                <a href="filmsözlük.html">FİLMSÖZLÜK</a>
            </div>
            <div class="right">
                <span id="userProfileContainer">
                    <i class="fa-solid fa-user" style="color: #fff; font-size: 24px;"></i>
                </span>
                <div class="searchEngine" id="searchEngine">
                    <input type="text" placeholder="...">
                    <i class="fa-solid fa-magnifying-glass" id="searchIcon"></i>
                </div>
            </div>
        </div>
    </div>

    <div class="auth-wrapper">
        <!-- Kayıt Ol Formu -->
        <div class="auth-container">
            <div class="form-container">
                <form id="registerForm">
                    <h2>Kayıt Ol</h2>
                    <div class="form-group">
                        <label for="username">Kullanıcı Adı</label>
                        <input type="text" id="username" required placeholder="Kullanıcı adınızı girin">
                    </div>
                    <div class="form-group">
                        <label for="registerEmail">E-posta</label>
                        <input type="email" id="registerEmail" required placeholder="E-posta adresinizi girin">
                    </div>
                    <div class="form-group">
                        <label for="registerPassword">Şifre</label>
                        <input type="password" id="registerPassword" required placeholder="Şifrenizi girin">
                    </div>
                    <div class="form-group">
                        <label for="profilePicture">Profil Fotoğrafı</label>
                        <select id="profilePicture" required>
                            <option value="/public/img/user/user-1.jpg">Profil 1</option>
                            <option value="/public/img/user/userman1.jpg">Profil 2</option>
                            <option value="/public/img/user/userwoman1.jpg">Profil 3</option>
                            <option value="/public/img/user/userwoman2.jpg">Profil 4</option>
                        </select>
                    </div>
                    <button type="submit">Kayıt Ol</button>
                </form>
            </div>
        </div>

        <!-- Giriş Yap Formu -->
        <div class="auth-container">
            <div class="form-container">
                <form id="loginForm">
                    <h2>Giriş Yap</h2>
                    <div class="form-group">
                        <label for="loginEmail">E-posta</label>
                        <input type="email" id="loginEmail" required placeholder="E-posta adresinizi girin">
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">Şifre</label>
                        <input type="password" id="loginPassword" required placeholder="Şifrenizi girin">
                    </div>
                    <button type="submit">Giriş Yap</button>
                </form>
            </div>
        </div>
    </div>

    <script type="module" src="/public/js/firebase-config.js"></script>
    <script type="module" src="/public/js/auth.js"></script>
    <script type="module">
        import { loginUser, registerUser } from '/public/js/auth.js';

        const registerForm = document.getElementById('registerForm');
        const loginForm = document.getElementById('loginForm');

        // Kayıt formu işlemi
        registerForm?.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const username = document.getElementById('username').value;
            const profilePicture = document.getElementById('profilePicture').value;

            try {
                const result = await registerUser(email, password, username, profilePicture);
                if (result.success) {
                    alert('Kayıt başarılı! Anasayfaya yönlendiriliyorsunuz.');
                    window.location.href = '/';
                } else {
                    alert(result.message || 'Kayıt sırasında bir hata oluştu.');
                }
            } catch (error) {
                console.error('Kayıt hatası:', error);
                alert('Kayıt sırasında bir hata oluştu.');
            }
        });

        // Giriş formu işlemi
        loginForm?.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const result = await loginUser(email, password);
                if (result.success) {
                    alert('Giriş başarılı! Anasayfaya yönlendiriliyorsunuz.');
                    window.location.href = '/';
                } else {
                    alert(result.message || 'Giriş sırasında bir hata oluştu.');
                }
            } catch (error) {
                console.error('Giriş hatası:', error);
                alert('Giriş sırasında bir hata oluştu.');
            }
        });
    </script>

    <script src="/public/js/script.js"></script>
    <script src="/public/js/search.js"></script>
    <script src="/public/js/scroll.js"></script>
</body>

</html>
