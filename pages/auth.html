<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap / Kayıt Ol | AiFlix Cinema</title>
    <link rel="stylesheet" href="/public/css/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        #backgroundVideo {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -1000;
            object-fit: cover;
            filter: brightness(0.35) contrast(1.15);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #0a0f1d;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(10, 15, 29, 0.4) 0%, rgba(10, 15, 29, 0.95) 100%);
            z-index: -999;
        }
    </style>
</head>

<body>
    <!-- Background Video -->
    <video autoplay muted loop id="backgroundVideo">
        <source src="/public/img/background/backgroundeneme2.mp4" type="video/mp4">
    </video>

    <!-- Modern Topbar -->
    <div class="topbar">
        <div class="wrapper">
            <!-- Left: Streaming Platform Logos -->
            <div class="left">
                <div class="topbar-brands">
                    <a href="https://www.netflix.com" target="_blank" rel="noopener" class="topbar-brand-link brand-netflix" title="Netflix">
                        <i class="fa-brands fa-netflix"></i>
                    </a>
                    <a href="https://www.primevideo.com" target="_blank" rel="noopener" class="topbar-brand-link brand-amazon" title="Amazon Prime Video">
                        <i class="fa-brands fa-amazon"></i>
                    </a>
                    <a href="https://tv.apple.com" target="_blank" rel="noopener" class="topbar-brand-link brand-apple" title="Apple TV+">
                        <i class="fa-brands fa-apple"></i>
                    </a>
                    <a href="https://www.imdb.com" target="_blank" rel="noopener" class="topbar-brand-link brand-imdb" title="IMDb">
                        <i class="fa-brands fa-imdb"></i>
                    </a>
                    <a href="https://www.youtube.com" target="_blank" rel="noopener" class="topbar-brand-link brand-youtube" title="YouTube Movies">
                        <i class="fa-brands fa-youtube"></i>
                    </a>
                </div>
            </div>

            <!-- Center: Navigation -->
            <div class="center">
                <a href="/"><i class="fa-solid fa-house"></i> ANASAYFA</a>
                <a href="/cinebot"><i class="fa-solid fa-robot"></i> CINEBOT AI</a>
                <a href="/filmsozluk"><i class="fa-solid fa-comments"></i> FİLMSÖZLÜK</a>
                <a href="/auth" class="active"><i class="fa-solid fa-user-lock"></i> GİRİŞ / KAYIT</a>
            </div>

            <!-- Right: Search Form & Profile -->
            <div class="right">
                <form class="topbar-search-form" onsubmit="event.preventDefault(); const q = this.querySelector('input').value.trim(); if(q) window.location.href='/cinebot?movie=' + encodeURIComponent(q);">
                    <input type="text" placeholder="Film ara...">
                    <button type="submit" title="Ara"><i class="fa-solid fa-magnifying-glass"></i></button>
                </form>
                <span id="userProfileContainer">
                    <i class="fa-solid fa-circle-user" style="color: #fff; font-size: 28px;"></i>
                </span>
            </div>
        </div>
    </div>

    <!-- Auth Container -->
    <div class="auth-page-body">
        <div class="auth-card">
            <!-- Header -->
            <div class="auth-header">
                <div class="auth-logo-badge">
                    <i class="fa-solid fa-film" style="color: #ff6b08;"></i> AiFlix Pass
                </div>
                <p>Yapay zeka destekli sinema topluluğuna katılın</p>
            </div>

            <!-- Modern Tabs -->
            <div class="auth-tabs">
                <button type="button" class="auth-tab-btn active" id="tabLogin" onclick="switchAuthTab('login')">
                    <i class="fa-solid fa-arrow-right-to-bracket"></i> Giriş Yap
                </button>
                <button type="button" class="auth-tab-btn" id="tabRegister" onclick="switchAuthTab('register')">
                    <i class="fa-solid fa-user-plus"></i> Kayıt Ol
                </button>
            </div>

            <!-- GİRİŞ YAP FORMU -->
            <form id="loginForm" style="display: block;">
                <div class="auth-form-group">
                    <label for="loginEmail">E-posta Adresi</label>
                    <div class="auth-input-wrap">
                        <input type="email" id="loginEmail" required placeholder="ornek@aiflix.com" autocomplete="email">
                        <i class="fa-solid fa-envelope input-icon"></i>
                    </div>
                </div>

                <div class="auth-form-group">
                    <label for="loginPassword">Şifre</label>
                    <div class="auth-input-wrap">
                        <input type="password" id="loginPassword" required placeholder="••••••••" autocomplete="current-password">
                        <i class="fa-solid fa-lock input-icon"></i>
                    </div>
                </div>

                <button type="submit" class="auth-submit-btn" id="loginSubmitBtn">
                    <i class="fa-solid fa-arrow-right-to-bracket"></i> Giriş Yap
                </button>

                <div class="auth-switch-text">
                    Hesabınız yok mu? <a onclick="switchAuthTab('register')">Hemen Kayıt Olun &rarr;</a>
                </div>
            </form>

            <!-- KAYIT OL FORMU -->
            <form id="registerForm" style="display: none;">
                <div class="auth-form-group">
                    <label for="username">Kullanıcı Adı</label>
                    <div class="auth-input-wrap">
                        <input type="text" id="username" required placeholder="Sinemasever99" autocomplete="username">
                        <i class="fa-solid fa-user input-icon"></i>
                    </div>
                </div>

                <div class="auth-form-group">
                    <label for="registerEmail">E-posta Adresi</label>
                    <div class="auth-input-wrap">
                        <input type="email" id="registerEmail" required placeholder="ornek@aiflix.com" autocomplete="email">
                        <i class="fa-solid fa-envelope input-icon"></i>
                    </div>
                </div>

                <div class="auth-form-group">
                    <label for="registerPassword">Şifre (En az 6 karakter)</label>
                    <div class="auth-input-wrap">
                        <input type="password" id="registerPassword" required placeholder="••••••••" minlength="6" autocomplete="new-password">
                        <i class="fa-solid fa-lock input-icon"></i>
                    </div>
                </div>

                <!-- Avatar Seçici -->
                <div class="auth-form-group">
                    <label>Profil Fotoğrafınızı Seçin</label>
                    <input type="hidden" id="profilePicture" value="/public/img/user/user-1.jpg">
                    <div class="avatar-grid">
                        <div class="avatar-option selected" onclick="selectAvatar(this, '/public/img/user/user-1.jpg')" title="Avatar 1">
                            <img src="/public/img/user/user-1.jpg" alt="Avatar 1">
                        </div>
                        <div class="avatar-option" onclick="selectAvatar(this, '/public/img/user/userman1.jpg')" title="Avatar 2">
                            <img src="/public/img/user/userman1.jpg" alt="Avatar 2">
                        </div>
                        <div class="avatar-option" onclick="selectAvatar(this, '/public/img/user/userwoman1.jpg')" title="Avatar 3">
                            <img src="/public/img/user/userwoman1.jpg" alt="Avatar 3">
                        </div>
                        <div class="avatar-option" onclick="selectAvatar(this, '/public/img/user/userwoman2.jpg')" title="Avatar 4">
                            <img src="/public/img/user/userwoman2.jpg" alt="Avatar 4">
                        </div>
                    </div>
                </div>

                <button type="submit" class="auth-submit-btn" id="registerSubmitBtn">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Hesabımı Oluştur
                </button>

                <div class="auth-switch-text">
                    Zaten hesabınız var mı? <a onclick="switchAuthTab('login')">Giriş Yapın &rarr;</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase Compat SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyDxzwT5RvvKrJq8qcR1AQGoMCvZU7keQsk",
          authDomain: "aiflix-f7b94.firebaseapp.com",
          projectId: "aiflix-f7b94",
          storageBucket: "aiflix-f7b94.firebasestorage.app",
          messagingSenderId: "149472297975",
          appId: "1:149472297975:web:2103ee6dc06a34e64ea4f2",
          measurementId: "G-QC5JTQH1KD"
        };
        if (typeof firebase !== 'undefined') {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            window.auth = firebase.auth();
            window.db = firebase.firestore();
        }
    </script>
    <script src="/public/js/auth.js"></script>
    <script src="/public/js/script.js"></script>
    <script>
        // Tab Switcher
        function switchAuthTab(mode) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const tabLogin = document.getElementById('tabLogin');
            const tabRegister = document.getElementById('tabRegister');

            if (mode === 'login') {
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
                tabLogin.classList.add('active');
                tabRegister.classList.remove('active');
            } else {
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
                tabRegister.classList.add('active');
                tabLogin.classList.remove('active');
            }
        }

        // Avatar Picker
        function selectAvatar(el, avatarUrl) {
            document.querySelectorAll('.avatar-option').forEach(opt => opt.classList.remove('selected'));
            el.classList.add('selected');
            document.getElementById('profilePicture').value = avatarUrl;
        }

        // URL Hash Check (#register or #login)
        if (window.location.hash === '#register') {
            switchAuthTab('register');
        }

        // Register Form Listener
        const registerForm = document.getElementById('registerForm');
        registerForm?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('registerSubmitBtn');
            const email = document.getElementById('registerEmail').value.trim();
            const password = document.getElementById('registerPassword').value;
            const username = document.getElementById('username').value.trim();
            const profilePicture = document.getElementById('profilePicture').value;

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Kayıt yapılıyor...';

            try {
                const result = await window.registerUser(email, password, username, profilePicture);
                if (result.success) {
                    alert('Kayıt başarılı! Hoş geldiniz, ' + username);
                    window.location.href = '/';
                } else {
                    alert(result.message || 'Kayıt sırasında bir hata oluştu.');
                }
            } catch (error) {
                console.error('Kayıt hatası:', error);
                alert('Kayıt sırasında bir hata oluştu.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-wand-magic-sparkles"></i> Hesabımı Oluştur';
            }
        });

        // Login Form Listener
        const loginForm = document.getElementById('loginForm');
        loginForm?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('loginSubmitBtn');
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Giriş yapılıyor...';

            try {
                const result = await window.loginUser(email, password);
                if (result.success) {
                    window.location.href = '/';
                } else {
                    alert(result.message || 'Giriş sırasında bir hata oluştu.');
                }
            } catch (error) {
                console.error('Giriş hatası:', error);
                alert('Giriş sırasında bir hata oluştu.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> Giriş Yap';
            }
        });
    </script>
</body>

</html>
