    <div class="login-container">
        <h2>Giriş Yap</h2>
        <input type="text" id="loginUsername" placeholder="Kullanıcı Adı" required>
        <input type="password" id="loginPassword" placeholder="Şifre" required>
        <button onclick="login()">Giriş Yap</button>
        <p>Hesabın yok mu? <a href="register.html">Kayıt Ol</a></p>
    </div>

    <script>
        function login() {
            var username = document.getElementById("loginUsername").value;
            var password = document.getElementById("loginPassword").value;

            // localStorage'dan tüm kullanıcıları al
            let users = JSON.parse(localStorage.getItem("users")) || [];

            // Kullanıcıyı dizide arayarak doğrulama yap
            let foundUser = users.find(user => user.username === username && user.password === password);

            if (foundUser) {
                // Kullanıcı bilgilerini localStorage'a kaydet
                localStorage.setItem("loggedInUser", username);
                localStorage.setItem("userProfilePicture", foundUser.profilePicture);

                alert("Giriş başarılı!");
                window.location.href = "/"; // Ana sayfaya yönlendir
            } else {
                alert("Hatalı kullanıcı adı veya şifre.");
            }
        }
    </script>
