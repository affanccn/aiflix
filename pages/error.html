<!DOCTYPE html>
<html lang="tr">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="/public/css/index.css">
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
   <title>404 Sayfa Bulunamadı - AiFlix</title>
   <style>
      body {
         margin: 0;
         padding: 0;
         background: linear-gradient(135deg, #0a0f1d, #141b2d);
         color: #fff;
         font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
         min-height: 100vh;
         display: flex;
         flex-direction: column;
      }

      .error-container {
         flex: 1;
         display: flex;
         flex-direction: column;
         align-items: center;
         justify-content: center;
         text-align: center;
         padding: 40px 20px;
         margin-top: 70px;
      }

      .error-icon {
         font-size: 5rem;
         color: #ff6b08;
         margin-bottom: 20px;
         animation: bounce 2s infinite ease-in-out;
      }

      @keyframes bounce {
         0%, 100% { transform: translateY(0); }
         50% { transform: translateY(-10px); }
      }

      .error-code {
         font-size: 4rem;
         font-weight: 800;
         margin: 0;
         background: linear-gradient(90deg, #ff6b08, #2196f3);
         -webkit-background-clip: text;
         background-clip: text;
         color: transparent;
      }

      .error-msg {
         font-size: 1.25rem;
         color: rgba(255, 255, 255, 0.8);
         margin: 15px 0 30px;
         max-width: 500px;
      }

      .home-btn {
         padding: 12px 28px;
         background: linear-gradient(90deg, #ff6b08, #2196f3);
         color: #fff;
         text-decoration: none;
         font-weight: bold;
         border-radius: 10px;
         box-shadow: 0 4px 15px rgba(255, 107, 8, 0.4);
         transition: all 0.3s ease;
      }

      .home-btn:hover {
         transform: translateY(-2px);
         box-shadow: 0 8px 25px rgba(33, 150, 243, 0.5);
      }
   </style>
</head>

<body>
   <div class="topbar">
      <div class="wrapper target">
         <div class="left">
            <i class="fa-solid fa-film"></i>
            <i class="fa-solid fa-scissors"></i>
            <i class="fa-solid fa-photo-film"></i>
            <i class="fa-solid fa-video"></i>
         </div>
         <div class="center">
            <a href="/">ANASAYFA</a>
            <a href="/cinebot">CINEBOT</a>
            <a href="/auth" id="authLink" style="display: none;">GİRİŞ YAP / KAYIT OL</a>
            <a href="/filmsozluk">FİLMSÖZLÜK</a>
         </div>
         <div class="right">
            <span id="userProfileContainer">
               <i class="fa-solid fa-user" style="color: #fff; font-size: 22px;"></i>
            </span>
         </div>
      </div>
   </div>

   <div class="error-container">
      <i class="fa-solid fa-film error-icon"></i>
      <h1 class="error-code">404</h1>
      <p class="error-msg">Aradığınız sahne veya sayfa senaryoda bulunamadı!</p>
      <a href="/" class="home-btn"><i class="fa-solid fa-house"></i> Anasayfaya Dön</a>
   </div>

   <script src="/public/js/script.js"></script>
</body>

</html>
