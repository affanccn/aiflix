   </div>
    <div class="register-container">
        <h2>Kayıt Ol</h2>
        <input type="text" id="registerUsername" placeholder="Kullanıcı Adı" required>
        <input type="password" id="registerPassword" placeholder="Şifre" required>
        <select id="profilePicture" required>
            <option value="">Profil Fotoğrafı Seçin</option>
            <option value="/public/img/user/user-1.jpg">Profil 1</option>
            <option value="/public/img/user/userman1.jpg">Profil 2</option>
            <option value="/public/img/user/userwoman1.jpg">Profil 3</option>
            <option value="/public/img/user/userwoman2.jpg">Profil 4</option>
        </select>
        <button onclick="register()">Kayıt Ol</button>
        <p>Zaten hesabın var mı? <a href="login.html">Giriş Yap</a></p>
    </div>

    <script>
        function register() {
            var username = document.getElementById("registerUsername").value;
            var password = document.getElementById("registerPassword").value;
            var profilePicture = document.getElementById("profilePicture").value;

            if (username && password && profilePicture) {
                // localStorage'dan mevcut kullanıcıları al
                let users = JSON.parse(localStorage.getItem("users")) || [];

                // Yeni kullanıcıyı diziye ekle
                users.push({ 
                    username: username, 
                    password: password,
                    profilePicture: profilePicture 
                });

                // Kullanıcıları localStorage'a tekrar kaydet
                localStorage.setItem("users", JSON.stringify(users));

                alert("Kayıt başarılı!");
                window.location.href = "login.html"; // Kayıt sonrası giriş sayfasına yönlendir
            } else {
                alert("Lütfen tüm alanları doldurun.");
            }
        }
    </script>
    
    <script src="../public/js/search.js"></script>
    <script src="../public/js/scroll.js"></script>
</body>
